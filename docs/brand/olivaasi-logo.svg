<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Olivaasi logo: a page with a highlighted line and sound waves</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- the page, with its top right corner folded -->
  <path d="M98 132a20 20 0 0 1 20-20h144l60 60v208a20 20 0 0 1-20 20H118a20 20 0 0 1-20-20z" fill="#FFFFFF"/>
  <path d="M262 112v44a16 16 0 0 0 16 16h44z" fill="#C7D7F5"/>
  <!-- lines of text; the second is being read aloud -->
  <rect x="122" y="228" width="176" height="36" rx="10" fill="#FDE68A"/>
  <rect x="134" y="198" width="136" height="14" rx="7" fill="#0B1B33"/>
  <rect x="134" y="239" width="150" height="14" rx="7" fill="#0B1B33"/>
  <rect x="134" y="280" width="122" height="14" rx="7" fill="#0B1B33"/>
  <rect x="134" y="321" width="88" height="14" rx="7" fill="#0B1B33"/>
  <!-- sound leaving the page -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="18">
    <path d="M360.6 230.3A40 40 0 0 1 360.6 281.7"/>
    <path d="M383.6 211A70 70 0 0 1 383.6 301" opacity="0.8"/>
    <path d="M406.6 191.7A100 100 0 0 1 406.6 320.3" opacity="0.6"/>
  </g>
</svg>
